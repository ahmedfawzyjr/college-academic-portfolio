<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Counter</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; color: #fff; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        button { background: #3b82f6; color: white; border: none; padding: 0.5rem 1.5rem; border-radius: 6px; font-size: 1rem; cursor: pointer; margin: 0.25rem; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Counter Application</h2>
        <h1 id="count">0</h1>
        <button id="decrement">-</button>
        <button id="reset">Reset</button>
        <button id="increment">+</button>
    </div>
    <script>
        let count = 0;
        const display = document.getElementById('count');
        document.getElementById('increment').addEventListener('click', () => { count++; display.textContent = count; });
        document.getElementById('decrement').addEventListener('click', () => { count--; display.textContent = count; });
        document.getElementById('reset').addEventListener('click', () => { count = 0; display.textContent = count; });
    </script>
</body>
</html>
